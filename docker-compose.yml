# ==============================================================================
# ArenaSync (BIT-57 Sports Platform) - Docker Compose Configuration
# ==============================================================================
services:
  arenasync:
    build:
      context: .
      dockerfile: Dockerfile
    image: arenasync:latest
    container_name: arenasync-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/actuator/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
